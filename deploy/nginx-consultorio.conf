# /etc/nginx/sites-available/consultorio
# Cambia TU_DOMINIO e IP_PRIVADA_BACKEND (aparece 2 veces). Certbot agrega después el HTTPS.

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name TU_DOMINIO.duckdns.org;

    root /var/www/consultorio;
    index index.html;
    server_tokens off;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # React con rutas /login, /registro, /dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login con límite de intentos (además de Fail2Ban)
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://IP_PRIVADA_BACKEND:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # API -> Backend por la red privada (VPC Peering)
    location /api/ {
        proxy_pass http://IP_PRIVADA_BACKEND:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
